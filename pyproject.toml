[project]
name = "anyagents"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "daeho", email = "" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
anyagents = "api:main"

[tool.uv.build-backend]
module-name = ["api", "agents"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
